# mamba env create -f environment.yml && mamba activate cenrep && pip install .
name: cenrep
channels: [conda-forge, bioconda]
dependencies:
  - python=3.10
  - numpy
  - pandas
  - pysam
  - pyhmmer>=0.12
  - matplotlib
  - pyabpoa=1.5.7
  - pytest
  - fastan=0.8                # default seed engine (FasTAN); fastga gives FAtoGDB, ONEview
  - fastga=1.5.20260729
  - trf=4.10.0rc2             # alternative seed engine (--seed-engine trf)
  - blast>=2.16
  - mafft=7.525
  - cd-hit=4.8.1
  - infernal
  - minimap2
  - samtools
