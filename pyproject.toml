[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cenrep"
version = "0.6.0"
description = "Centromeric satellite, HOR and tandem-repeat annotation, de novo, for one or many genomes"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas", "pysam", "pyhmmer>=0.12", "matplotlib"]

[project.scripts]
cenrep = "cenrep.cli:main"

[tool.setuptools]
packages = ["cenrep"]

[tool.setuptools.package-data]
cenrep = ["data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
